; ==============================================================================
;  ULTIMATE REALISM FRAMEWORK  v1.0
;  GTA V  +  ScriptHookVDotNet3 (3.6.0 or newer)
; ==============================================================================
;
;  Every number in this file is a physical quantity, not a magic gameplay value.
;  Where a unit exists it is stated (kcal, litres, Celsius, km/h, ml/s, metres).
;
;  LIVE EDITING
;    Save this file while the game is running and the framework reloads it within
;    half a second. Modules can be switched on and off, and every tunable can be
;    re-tuned, without restarting the game and without leaving anything behind:
;    whatever a module changed in the world is restored when it is switched off.
;
;  SAFETY
;    This framework never edits handling.meta, visualsettings.dat, timecycle
;    files or any other game/mod file. Everything it does happens at runtime and
;    is reverted when the module is disabled or the script unloads.
;
;  IF SOMETHING GOES WRONG
;    scripts\UltraRealism.log            - what happened, in order
;    scripts\UltraRealism_Error.log      - only the errors, with stack traces
;    scripts\UltraRealism_SystemReport.txt - full diagnostics (Ctrl+F12 in game)
;
; ==============================================================================


[Framework]
; Write trace-level detail to the log. Use only when reporting a problem.
VerboseLogging = false

; Show on-screen notifications for survival/trauma events.
ShowNotifications = true

; Hard cap on notifications per minute across all modules (anti-spam).
MaxNotificationsPerMinute = 8

; 0 = randomise per session. A non-zero value makes behaviour reproducible,
; which is invaluable when chasing a bug report.
RandomSeed = 0

; --- performance governor -----------------------------------------------------
; The budget is CPU milliseconds per SECOND of wall-clock time, not per frame.
; This is the only budget that behaves the same at 60 Hz and at 240 Hz: a fixed
; per-frame budget silently quadruples the total work at four times the refresh
; rate, which is the usual cause of stutter on high-refresh displays.
; When the framework exceeds the budget the scheduler stretches its intervals
; (fewer, larger simulation steps) and recovers automatically afterwards.
WorkBudgetMsPerSecond = 28

; Upper bound on that interval stretching (12 = a 1 s task may run every 12 s
; while the game is under heavy load). Raise only if you run very heavy mods.
MaxSchedulerScale = 12


[Modules]
; Every module can be disabled independently, at runtime, without side effects.
; A disabled module restores whatever it changed before going quiet.
Compatibility.Enabled = true
Survival.Enabled = true
Trauma.Enabled = true
VehicleDynamics.Enabled = true
VehicleMechanics.Enabled = true
AmbientAI.Enabled = true
EmergencyDispatch.Enabled = true
AdvancedKinematics.Enabled = true
EnvironmentLighting.Enabled = true
DebugOverlay.Enabled = true


; ==============================================================================
;  1. BIOLOGICAL & SURVIVAL REALISM
; ==============================================================================
[Survival]
; --- metabolism ---------------------------------------------------------------
; Energy model: kcal/min = MET * 3.5 ml O2/kg/min * body mass / 200
; MET values come from the Compendium of Physical Activities (resting 1.0,
; walking 3.5, running 9.8, sprinting 15.0, swimming 8.0, fighting 7.0).
Metabolism.Enabled = true
Metabolism.Scale = 1.0
Metabolism.BodyMassKg = 82
Metabolism.DailyCalories = 2400
Metabolism.DailyWaterLitres = 2.4
; 0.065 => roughly 15 hours awake to reach total exhaustion.
Metabolism.FatiguePerHourAwake = 0.065
Metabolism.RestRecoveryPerHour = 0.16
Metabolism.RestRecoveryDelaySeconds = 25
; Sprinting, swimming and combat burn more than the MET table alone implies.
Stamina.ExertionDrainMultiplier = 1.35

; --- hunger / thirst consequences --------------------------------------------
Hunger.EffectThreshold = 0.65
Hunger.HealthDrainPerSecond = 0.06
Thirst.EffectThreshold = 0.60
Thirst.HealthDrainPerSecond = 0.09
Fatigue.EffectThreshold = 0.75
Fatigue.RunSpeedPenalty = 0.22

; --- thermoregulation ---------------------------------------------------------
; First-order heat balance over body thermal mass, forced by ambient temperature,
; clothing insulation, wetness, wind chill, shivering and sweating.
Thermal.Enabled = true
Thermal.BaseCoreTemp = 36.8
; 0 = naked, 1 = arctic gear. A detected coat adds CoatInsulationBonus.
Thermal.ClothingInsulation = 0.45
Thermal.CoatInsulationBonus = 0.22
Thermal.ColdThreshold = 35.5
Thermal.HeatThreshold = 39.0
Thermal.ColdDamagePerSecond = 0.05
Thermal.HeatDamagePerSecond = 0.07
; Drive the character's sweat/wetness channels so appearance matches the model.
Thermal.CosmeticEffects = true
; Raycast upward to detect roofs/interiors (shelter from rain and sun).
Thermal.AutoShelterDetection = true

; --- hotkeys ------------------------------------------------------------------
Hotkey.Eat = F7
Hotkey.Drink = F8
Hotkey.Status = F10


; ==============================================================================
;  2. INJURY & TRAUMA PHYSICS
; ==============================================================================
[Trauma]
; Wound severity is derived from the damage that actually landed, normalised to
; a quarter of the character's health pool - so a full magazine to the torso is
; catastrophic and a graze is minor, with no weapon table to keep in sync.
Severity.Multiplier = 1.0
; 0.5 = forgiving, 2.0 = brutal.
Bleed.Multiplier = 1.0
Bleed.BloodVolumeLitres = 5.0
Bleed.ShockThreshold = 0.70
Bleed.CollapseThreshold = 0.55
Bleed.DeathThreshold = 0.45
Bleed.AllowDeath = true
Healing.SeverityRecoveryPerMinute = 0.02

; --- localised impairment -----------------------------------------------------
; Leg wounds limp (speed + injured movement clipset),
; arm wounds destabilise aim and add recoil.
Mobility.LegSpeedPenalty = 0.55
Mobility.ArmAccuracyPenalty = 0.50
Mobility.UseInjuredMovementClipset = true

; --- pain & adrenaline --------------------------------------------------------
; Adrenaline masks pain for a short window, then crashes: pain floods back and
; fatigue spikes. Sympathetic nervous system, modelled.
Pain.PerSeverity = 0.85
Pain.CameraEffects = true
Adrenaline.GainPerDamage = 0.9
Adrenaline.DecaySeconds = 35

; --- treatment -----------------------------------------------------------------
; A tourniquet genuinely stops extremity bleeding - but costs the limb if left on.
Treatment.TourniquetNecrosisMinutes = 25

; --- hotkeys -------------------------------------------------------------------
Hotkey.Bandage = F5
Hotkey.Tourniquet = F6
Hotkey.Painkillers = Ctrl+F5
Hotkey.Medkit = Ctrl+F6
Hotkey.Status = F9


; ==============================================================================
;  3. VEHICLE KINETICS & SURFACE PHYSICS
; ==============================================================================
[VehicleDynamics]
; Runtime handling adjustment through the live CHandlingData block of whatever
; car you are driving - vanilla, DLC or modded. No handling.meta is touched, and
; every field is restored with a compare-and-restore guard, so a handling editor
; or a car-pack script that also writes a field is never fought over.
Physics.Enabled = true
Physics.AffectTrafficVehicles = true
Physics.TrafficRadiusMetres = 90

; grip        = surfaceGrip * weatherRetention * tyreCondition * tyreTemperature
; tractionMax = original * grip
; brakeForce  = original * (0.45 + 0.55 * grip)
; lateral     = original * (0.5 + 0.5 * grip)
Physics.GripScale = 1.0
Physics.BrakeScale = 1.0
Physics.PowerScale = 1.0
Physics.MinGripFactor = 0.35
Physics.MaxGripFactor = 1.12

; Second grip layer for snow/ice (SET_VEHICLE_REDUCE_GRIP), always reverted.
Physics.UseGripReductionNative = true
Physics.GripReductionThreshold = 0.42

; Steering authority falls with speed: 0 = arcade, 0.6 = heavy realism.
Physics.SpeedSensitiveSteering = 0.35

; Standing water: grip falls progressively above this speed.
Physics.AquaplaningStartKmh = 85

; Mild stabilisation for keyboard players on very low grip surfaces.
Physics.TractionControlAssist = false

Hotkey.Status = None
Hotkey.Toggle = None


; ==============================================================================
;  4. MECHANICAL DEGRADATION & THERMAL MANAGEMENT
; ==============================================================================
[VehicleMechanics]
; --- fuel ----------------------------------------------------------------------
; Consumption comes from engine load (throttle + RPM), not from speed alone:
; idling in traffic costs fuel, coasting downhill costs almost nothing.
; >>> If you already run a dedicated fuel mod, the compatibility layer turns this
; >>> off automatically ([Compatibility] AutoYield.Fuel = true).
Fuel.Enabled = true
Fuel.ConsumptionScale = 1.0
Fuel.TankLitresDefault = 60
Fuel.PricePerLitre = 1.6
Fuel.FreeRefuel = false
Fuel.LeakHealthThreshold = 0.75

; --- engine heat ---------------------------------------------------------------
Heat.Enabled = true
Heat.IdleTemperatureC = 88
Heat.OverheatTemperatureC = 116
Heat.DamageTemperatureC = 126
Heat.DerateStartTemperatureC = 108
Heat.Scale = 1.0

; --- oil -----------------------------------------------------------------------
Oil.Enabled = true

; --- tyres ---------------------------------------------------------------------
; Wear integrates slip, surface abrasiveness and speed. Temperature builds with
; friction; a hot, worn tyre can fail; rough ground punctures.
Tyres.Enabled = true
Tyres.WearScale = 1.0
Tyres.TemperatureScale = 1.0
Tyres.PunctureScale = 1.0

; --- brakes --------------------------------------------------------------------
Brakes.Enabled = true
Brakes.FadeTemperatureC = 480
Brakes.CoolingScale = 1.0

; Allow a starved or destroyed engine to cut out.
Mechanics.AllowStall = true

Hotkey.Refuel = F11
Hotkey.Status = Ctrl+F11


; ==============================================================================
;  5. AMBIENT WORLD & PEDESTRIAN AI
; ==============================================================================
[AmbientAI]
Reactions.Weather = true
Reactions.Danger = true
Reactions.HostilePosture = true
Reactions.Traffic = true
Reactions.AmbientChatter = true

; Leave these off unless you know what you are doing: mission peds and law
; enforcement have their own scripts and must not be second-guessed.
Scope.AffectPolice = false
Scope.AffectMissionPeds = false

Weather.ShelterChance = 0.55
Danger.FleeChance = 0.75
Danger.Radius = 25
Danger.PostureRadius = 18
Traffic.HonkChance = 0.45

; --- performance ---------------------------------------------------------------
; A rotating budget: N peds every PassIntervalMs, each with its own cooldown,
; so a crowd of 60 is covered in a couple of seconds instead of every frame.
Performance.ScanRadiusMetres = 60
Performance.MaxPedsPerPass = 12
Performance.PassIntervalMs = 500

Hotkey.Status = None


; ==============================================================================
;  6. REALISTIC EMERGENCY DISPATCH
; ==============================================================================
[EmergencyDispatch]
Dispatch.Enabled = true
Dispatch.PoliceEnabled = true
Dispatch.EmsEnabled = true
Dispatch.FireEnabled = true
Dispatch.MaxConcurrentUnits = 3

; Real call-handling time before anything is sent.
Dispatch.PoliceCallDelaySeconds = 12
Dispatch.EmsCallDelaySeconds = 16
Dispatch.FireCallDelaySeconds = 14

; Units are created OUT OF SIGHT, on a real road node, and then drive in.
; Their arrival time is whatever the map and traffic actually allow.
Dispatch.MinSpawnDistanceMetres = 180
Dispatch.MaxSpawnDistanceMetres = 420

; If the right service is already this close, it is re-tasked instead of doubled.
Dispatch.ReuseRadiusMetres = 250

Dispatch.UnitLifetimeSeconds = 150
Dispatch.DespawnDistanceMetres = 650
Dispatch.ShowBlips = true

; Paramedics treat the player on arrival.
Dispatch.EmsTreatsPlayer = true
Dispatch.MedicalThreshold = 0.35

; Station coordinates, 'x,y,z' entries separated by '|'.
Stations.Police = -1076.6,-826.2,19.0 | 1853.1,3689.2,34.3 | -448.2,6013.1,31.7 | -1098.6,-808.5,19.0
Stations.Ems = 294.3,-1448.0,29.9 | -441.0,-340.0,34.5 | -247.0,6331.0,32.4
Stations.Fire = 215.0,-1631.0,29.4 | -633.0,-120.0,39.0

Hotkey.Status = None


; ==============================================================================
;  7. COMPATIBILITY & SAFETY
; ==============================================================================
[Compatibility]
; Auto-yield: if another mod already owns a subsystem, ours steps aside instead
; of the two of them fighting over the same vehicle/ped every frame.
AutoYield.Fuel = true
AutoYield.Damage = false
AutoYield.Weather = false
AutoYield.Dispatch = false

; Mirror trace-level messages into the main log (support use only).
Diagnostics.VerboseLogging = false

; Writes UltraRealism_SystemReport.txt (full diagnostics).
Hotkey.Report = Ctrl+F12


; ==============================================================================
;  8. DIAGNOSTIC OVERLAY  (off by default)
; ==============================================================================
[DebugOverlay]
StartVisible = false
Scale = 0.32
PositionX = 0.012
PositionY = 0.015
ShowPlayerState = true
ShowModules = true
ShowPerformance = true

Hotkey.Toggle = F4


; ==============================================================================
;  9. ADVANCED KINEMATICS & PROCEDURAL SCALING
; ==============================================================================
;  Movement that answers to the ground and to the body that is doing it.
;
;  SLOPE ADAPTATION samples the terrain 1.4 m in front of, behind and beside the
;  player and turns the gradient into a movement multiplier: climbing costs speed
;  and descending returns a little of it. Cross-slope movement costs a little too,
;  because a real stride shortens on the uphill leg.
;
;  LEG IK makes feet plant on uneven ground instead of sliding, and Euphoria
;  body-balance stiffness rises with mass and slope, so a heavy character braces
;  where a light one sways.
;
;  PROCEDURAL SCALING gives every pedestrian a deterministic physique profile
;  derived from its handle and model hash: stature 0.88-1.12, mass 0.85-1.18,
;  stride bias 0.95-1.05. The same ped always looks and moves the same way, but
;  no two peds are identical. This is what stops crowds reading as clones.
;
;  HONEST LIMIT: the game exposes no native to rescale a ped's mesh. Physique is
;  expressed through locomotion, balance and (optionally) the collision capsule.
;  Anything claiming to resize pedestrian models is swapping model files, which
;  this framework will never do.
;
;  COST: four ground samples at 5 Hz for the player, one ground sample per managed
;  ped at 2 Hz, plus one natural-motion message per managed ped every 2 s. All of
;  it lives inside the governor's budget.
[AdvancedKinematics]
; Walk speed reacts to the gradient under your feet.
Locomotion.SlopeAdaptation = true

; Tune natural-motion balance to body mass and terrain slope.
Locomotion.EuphoriaBalance = true

; Foot planting on uneven ground.
Locomotion.LegIK = true

; Fraction of walk speed lost on a 30 degree climb.
Locomotion.UphillPenalty = 0.16

; Fraction of walk speed gained on a 30 degree descent.
Locomotion.DownhillBonus = 0.06

; Gradient at which UphillPenalty / DownhillBonus are fully applied; steeper
; terrain (cliffs, stairs) is clamped to the same value.
Locomotion.MaxSlopeDegrees = 30

; Deterministic mass/stature profile per pedestrian, feeding gait and balance.
Scaling.PhysiqueVariety = true

; EXPERIMENTAL: vary the collision capsule radius with body mass.
; Reverted when the module is disabled. Off by default because it changes how
; peds bump into each other, which some players notice more than they like.
Scaling.CapsuleVariety = false

; Base capsule radius used when CapsuleVariety is on (metres).
Scaling.CapsuleBaseRadius = 0.28

; How many nearby pedestrians get IK/balance treatment per pass.
Performance.MaxManagedPeds = 10

; Radius in which pedestrians are managed (metres).
Performance.ManageRadiusMetres = 35

; How often natural-motion balance is refreshed per pedestrian (ms).
Performance.EuphoriaIntervalMs = 2000


; ==============================================================================
;  10. ENVIRONMENTAL LIGHTING & REFLECTIONS
; ==============================================================================
;  Contrast and reflection calibration driven by the in-game clock and weather.
;
;  WHY THIS WORKS WITHOUT A SHADER: the game's auto-exposure adapts too hard at
;  night, which is what turns distant lamps into white blobs and flattens the
;  contrast you would see with your own eyes. Nudging the exposure TARGET by time
;  of day and weather restores contrast for free - the renderer was going to
;  compute exposure anyway, so there is no extra pass, no extra texture and no
;  measurable cost.
;
;  REFLECTIONS are per-entity in this engine. Flagging only the vehicles that are
;  actually visible (and releasing everything else) gives better water
;  reflections while doing LESS work than the engine's default shortlist. Wet
;  sheen on rain-soaked pedestrians comes from the material response channel and
;  is released the moment the rain stops.
;
;  HONEST LIMITS: there is no native bloom/HDR setter beyond the exposure tweak,
;  and none that can reprogram the water shader's current/ripple simulation. What
;  this module controls is exposure, shadow-cascade scale, reflection flags and
;  material response - all of them revertible, none of them file-replacing.
;
;  VISUAL PACKS: if NaturalVision / VisualV / QuantV is installed, timecycle
;  grading stays off so the pack keeps full ownership of the look.
[Lighting]
; Calibrate the exposure target by time of day and weather.
Exposure.Enabled = true

; Exposure multiplier in clear daylight (1.0 = the game's own value).
Exposure.Day = 1.0

; Night exposure. Slightly below 1 keeps highlights from blooming white.
Exposure.Night = 0.92

; Dawn/dusk exposure.
Exposure.Dusk = 0.96

; Added in rain: flat light needs a lift, not a crush.
Exposure.RainBoost = 0.04

; Subtracted in a thunderstorm.
Exposure.StormTrim = 0.03

; Scale shadow cascades with the sun angle. 1.0 = the vanilla renderer.
Shadows.Enabled = true
Shadows.DayScale = 1.0

; Low sun means long shadows; a slightly wider cascade keeps their far end.
; Above 1.0 costs GPU time - your choice, not a default.
Shadows.NightScale = 1.06

; Water reflections on the vehicles you can actually see, and wet sheen in rain.
Reflections.Enabled = true
Reflections.WetSheen = true
Reflections.WetSheenMax = 0.75
Reflections.MaxEntities = 12
Reflections.RadiusMetres = 70

; OPT-IN colour grading through timecycle modifiers. Off by default, because a
; visual pack should own the look. Set Enabled = true to use the modifiers below.
; DayModifier is empty on purpose: daylight is already correct; the gains are at
; night and at the edges of the day. Valid names come from the game's own
; timecycle list (e.g. cinema, prologue_ending, secret_camera, NG_filmic01).
Timecycle.Enabled = false
Timecycle.DayModifier =
Timecycle.NightModifier = cinema
Timecycle.DuskModifier = cinema
Timecycle.Strength = 0.35

; Never touch the timecycle when a visual pack is installed (recommended).
AutoYield.VisualPacks = true


